server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    location = /ti-para-clinicas.html { return 301 /ti-para-saude.html; }
    location = /missao-e-valores.html { return 301 /quem-somos.html#missao; }
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico)$ { expires 7d; }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /index.html;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
